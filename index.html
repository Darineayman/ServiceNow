<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- AngularJS -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>

  <title>Simple Angular Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .result {
      margin-top: 15px;
      color: #333;
    }
  </style>
</head>

<body ng-controller="myCtrl">

  <div class="container">
    <h2>New App</h2>

    <input type="text" ng-model="email" placeholder="Enter your email">

    <button ng-click="customShow()">Submit</button>

    <div class="result" ng-if="result">
      {{result}}
    </div>
  </div>

  <script>
    var app = angular.module('myApp', []);

    app.controller('myCtrl', function($scope) {

      $scope.customShow = function(){
        $scope.result = "Hello " + $scope.email;
      };

    });
  </script>

</body>
</html>
