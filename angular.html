<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Shadow Form</title>
  </head>

  <body class="bg-light">
    <div
      ng-app="myApp"
      class="container vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow p-4" style="width: 400px" ng-controller="myCtrl">
        <h4 class="text-center mb-4">New App</h4>

        <form>
          <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="name" class="form-control" ng-model="name" required />
            <label class="form-label">Enter Password</label>
            <input
              type="password"
              class="form-control"
              ng-model="password"
              required
            />
            <div class="form-text">
              We'll never share your email with anyone else.
            </div>
          </div>

          <div class="mb-3 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              ng-model="isChecked"
            />
            <label class="form-check-label">Check me out</label>
          </div>

          <button
            type="button"
            class="btn btn-primary w-100"
            ng-click="customShow()"
            ng-disabled="!name || !password"
          >
            Login
          </button>

          <div class="alert alert-success mt-3 text-center" ng-if="result">
            {{result}}
          </div>

          <div class="alert alert-danger mt-3 text-center" ng-if="error">
            {{error}}
          </div>
          <div
            class="alert alert-success mt-3 text-center"
            ng-show="isChecked && result"
          >
            {{result}}
          </div>
        </form>
      </div>
    </div>

    <script>
      var app = angular.module("myApp", []);

      app.controller("myCtrl", function ($scope) {
        let name = "dareen";
        let password = "123456";
        $scope.customShow = function () {
          $scope.result = "";
          $scope.error = "";
          if (!$scope.name || !$scope.password) {
            $scope.error = "Both username and password are required.";
            return;
          }
          if (!$scope.isChecked) {
            $scope.error = "You must accept the checkbox.";
            return;
          }
          if ($scope.password.length < 6) {
            $scope.error = "Password must be at least 6 characters long.";
            return;
          }
          if ($scope.name != name || $scope.password != password) {
            $scope.error = "Invalid username or password.";
            return;
          }

          $scope.result = "Hello " + $scope.name;
        };
      });

    </script>
  </body>
</html>
